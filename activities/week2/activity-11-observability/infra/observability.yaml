AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FossilRAG ingestion pipeline — observability layer.
  Defines CloudWatch Alarms and a dashboard backed by EMF metrics
  emitted by pipeline.py (namespace FossilRAG/Pipeline).

  Apply with:
    aws cloudformation deploy \
      --template-file infra/observability.yaml \
      --stack-name fossilrag-pipeline-observability \
      --parameter-overrides \
          FunctionName=fossilrag-ingestion-staging \
          AlarmNotificationTopic=arn:aws:sns:us-east-1:123:fossilrag-oncall

Parameters:
  FunctionName:
    Type: String
    Description: Lambda function name emitting the metrics.
    Default: fossilrag-ingestion-staging

  AlarmNotificationTopic:
    Type: String
    Description: SNS topic ARN to notify on alarm. Use "" to skip notifications.
    Default: ""

  FailureRateThreshold:
    Type: Number
    Description: Failure-rate threshold (failures per 5 min) before alarming.
    Default: 3

  P99LatencyThresholdMs:
    Type: Number
    Description: p99 latency threshold (ms) before alarming.
    Default: 30000

  MinRowsIngested:
    Type: Number
    Description: Minimum row count per invocation before alarming on empty output.
    Default: 1

Conditions:
  HasSnsTopic: !Not [!Equals [!Ref AlarmNotificationTopic, ""]]

Resources:

  # ----------------------------------------------------------------------
  # Alarms
  # ----------------------------------------------------------------------

  # Fires when the per-stage Errors metric exceeds the threshold over
  # 5 minutes. The threshold is small on purpose — failure rate is
  # what we want to alarm on, not absolute counts, and at staging
  # traffic 3 failures in 5 minutes is well above noise.
  #
  # IMPORTANT: every EMF metric is emitted WITH a `Stage` dimension, and
  # CloudWatch does NOT synthesize a dimensionless rollup from dimensioned
  # series. A dimensionless alarm on `Errors` would watch a series that is
  # never published and could never fire. So each alarm below pins the
  # exact `Stage` dimension value it watches, and the composite alarm
  # fans the per-stage alarms into one notification.
  #
  # We use per-stage alarms (not a single metric-math SUM across stages)
  # on purpose: a single basic alarm on `Errors{Stage=read}` matches the
  # emitted series exactly, and sidesteps the metric-math missing-data
  # question for the partial-failure case (when `normalise` throws, only
  # `read`/`normalise` emit that invocation — `write`/`upload` are absent).
  PipelineErrorsReadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-errors-read
      AlarmDescription: !Sub |
        Errors in the READ stage exceeded ${FailureRateThreshold} in a 5-minute window.
        Run the Logs Insights query in docs/logs-insights-queries.md (filter Stage="read").
      Namespace: FossilRAG/Pipeline
      MetricName: Errors
      Dimensions:
        - Name: Stage
          Value: read
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: !Ref FailureRateThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  PipelineErrorsNormaliseAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-errors-normalise
      AlarmDescription: !Sub |
        Errors in the NORMALISE stage exceeded ${FailureRateThreshold} in a 5-minute window.
        Most common cause: upstream CSV schema drift (renamed/missing columns).
      Namespace: FossilRAG/Pipeline
      MetricName: Errors
      Dimensions:
        - Name: Stage
          Value: normalise
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: !Ref FailureRateThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  PipelineErrorsWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-errors-write
      AlarmDescription: !Sub |
        Errors in the WRITE stage exceeded ${FailureRateThreshold} in a 5-minute window.
      Namespace: FossilRAG/Pipeline
      MetricName: Errors
      Dimensions:
        - Name: Stage
          Value: write
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: !Ref FailureRateThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  PipelineErrorsUploadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-errors-upload
      AlarmDescription: !Sub |
        Errors in the UPLOAD stage exceeded ${FailureRateThreshold} in a 5-minute window.
        Usually S3 (throttling / NoSuchBucket / credentials).
      Namespace: FossilRAG/Pipeline
      MetricName: Errors
      Dimensions:
        - Name: Stage
          Value: upload
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: !Ref FailureRateThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  # Per-stage p99 latency. Alarms on the p99 extended statistic directly
  # (averaging averages would hide tail spikes). One alarm per stage so
  # each watches its own emitted `Latency{Stage=...}` series.
  PipelineLatencyReadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-p99-latency-read
      AlarmDescription: !Sub |
        READ-stage p99 latency exceeded ${P99LatencyThresholdMs}ms over a 5-minute window.
      Namespace: FossilRAG/Pipeline
      MetricName: Latency
      Dimensions:
        - Name: Stage
          Value: read
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref P99LatencyThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  PipelineLatencyNormaliseAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-p99-latency-normalise
      AlarmDescription: !Sub |
        NORMALISE-stage p99 latency exceeded ${P99LatencyThresholdMs}ms over a 5-minute window.
      Namespace: FossilRAG/Pipeline
      MetricName: Latency
      Dimensions:
        - Name: Stage
          Value: normalise
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref P99LatencyThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  PipelineLatencyWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-p99-latency-write
      AlarmDescription: !Sub |
        WRITE-stage p99 latency exceeded ${P99LatencyThresholdMs}ms over a 5-minute window.
      Namespace: FossilRAG/Pipeline
      MetricName: Latency
      Dimensions:
        - Name: Stage
          Value: write
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref P99LatencyThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  PipelineLatencyUploadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-p99-latency-upload
      AlarmDescription: !Sub |
        UPLOAD-stage p99 latency exceeded ${P99LatencyThresholdMs}ms over a 5-minute window.
      Namespace: FossilRAG/Pipeline
      MetricName: Latency
      Dimensions:
        - Name: Stage
          Value: upload
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref P99LatencyThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  # Detects the silent-failure mode: pipeline ran, no exception, but
  # produced zero rows. The summary metrics are emitted with
  # `Stage=summary`, so this alarm pins that dimension — without it the
  # alarm would watch a non-existent dimensionless series and, with
  # TreatMissingData=breaching, sit in permanent ALARM.
  PipelineEmptyOutputAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-empty-output
      AlarmDescription: |
        Pipeline reported success but RowsIngested < threshold.
        Likely cause: schema drift in upstream CSV; check normalise() vs latest header.
      Namespace: FossilRAG/Pipeline
      MetricName: RowsIngested
      Dimensions:
        - Name: Stage
          Value: summary
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref MinRowsIngested
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching  # missing data here means the pipeline didn't run at all
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  # Composite alarm so PagerDuty / Slack only fires once when multiple
  # related alarms trip together (e.g. a slow stage usually causes
  # failures too). Keeps the noise down at 2 AM. Fans in every per-stage
  # error + latency alarm plus the empty-output alarm.
  PipelineHealthCompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    # No explicit DependsOn — AlarmRule's !Ref creates the ordering
    # implicitly, and an explicit list trips cfn-lint W3005.
    Properties:
      AlarmName: !Sub fossilrag-${FunctionName}-health
      AlarmRule: !Sub
        - >-
          ALARM("${ER}") OR ALARM("${EN}") OR ALARM("${EW}") OR ALARM("${EU}")
          OR ALARM("${LR}") OR ALARM("${LN}") OR ALARM("${LW}") OR ALARM("${LU}")
          OR ALARM("${EO}")
        - ER: !Ref PipelineErrorsReadAlarm
          EN: !Ref PipelineErrorsNormaliseAlarm
          EW: !Ref PipelineErrorsWriteAlarm
          EU: !Ref PipelineErrorsUploadAlarm
          LR: !Ref PipelineLatencyReadAlarm
          LN: !Ref PipelineLatencyNormaliseAlarm
          LW: !Ref PipelineLatencyWriteAlarm
          LU: !Ref PipelineLatencyUploadAlarm
          EO: !Ref PipelineEmptyOutputAlarm
      AlarmActions:
        - !If [HasSnsTopic, !Ref AlarmNotificationTopic, !Ref AWS::NoValue]

  # ----------------------------------------------------------------------
  # Dashboard (last 24h at a glance)
  # ----------------------------------------------------------------------

  PipelineDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub fossilrag-${FunctionName}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# FossilRAG ingestion — last 24h\n**Function:** ${FunctionName}  ·  **Namespace:** FossilRAG/Pipeline  ·  **Runbook:** docs/runbook.md  ·  **Logs Insights queries:** docs/logs-insights-queries.md"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Invocations vs failures (5 min)",
                "metrics": [
                  [ "FossilRAG/Pipeline", "Invocations", "Stage", "summary", { "stat": "Sum", "label": "Invocations" } ],
                  [ ".", "InvocationFailures", ".", ".", { "stat": "Sum", "label": "Failures", "color": "#d62728" } ]
                ],
                "region": "${AWS::Region}",
                "period": 300,
                "view": "timeSeries",
                "stacked": false
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Per-stage errors (5 min)",
                "metrics": [
                  [ "FossilRAG/Pipeline", "Errors", "Stage", "read", { "stat": "Sum" } ],
                  [ "...", "normalise", { "stat": "Sum" } ],
                  [ "...", "write", { "stat": "Sum" } ],
                  [ "...", "upload", { "stat": "Sum" } ]
                ],
                "region": "${AWS::Region}",
                "period": 300,
                "view": "timeSeries",
                "stacked": true
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Per-stage latency p50 / p99 (ms)",
                "metrics": [
                  [ "FossilRAG/Pipeline", "Latency", "Stage", "read",      { "stat": "p50", "label": "read p50" } ],
                  [ "...",  { "stat": "p99", "label": "read p99" } ],
                  [ "FossilRAG/Pipeline", "Latency", "Stage", "normalise", { "stat": "p50", "label": "normalise p50" } ],
                  [ "...",  { "stat": "p99", "label": "normalise p99" } ],
                  [ "FossilRAG/Pipeline", "Latency", "Stage", "write",     { "stat": "p50", "label": "write p50" } ],
                  [ "...",  { "stat": "p99", "label": "write p99" } ],
                  [ "FossilRAG/Pipeline", "Latency", "Stage", "upload",    { "stat": "p50", "label": "upload p50" } ],
                  [ "...",  { "stat": "p99", "label": "upload p99" } ]
                ],
                "region": "${AWS::Region}",
                "period": 300,
                "view": "timeSeries",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Rows ingested vs dropped (5 min sum)",
                "metrics": [
                  [ "FossilRAG/Pipeline", "RowsIngested", "Stage", "summary", { "stat": "Sum" } ],
                  [ ".", "RowsDropped",   ".", ".",                            { "stat": "Sum", "color": "#ff9800" } ]
                ],
                "region": "${AWS::Region}",
                "period": 300,
                "view": "timeSeries",
                "stacked": false
              }
            },
            {
              "type": "alarm",
              "x": 0, "y": 14, "width": 24, "height": 4,
              "properties": {
                "title": "Active alarms",
                "alarms": [
                  "${PipelineHealthCompositeAlarm.Arn}",
                  "${PipelineErrorsReadAlarm.Arn}",
                  "${PipelineErrorsNormaliseAlarm.Arn}",
                  "${PipelineErrorsWriteAlarm.Arn}",
                  "${PipelineErrorsUploadAlarm.Arn}",
                  "${PipelineLatencyReadAlarm.Arn}",
                  "${PipelineLatencyNormaliseAlarm.Arn}",
                  "${PipelineLatencyWriteAlarm.Arn}",
                  "${PipelineLatencyUploadAlarm.Arn}",
                  "${PipelineEmptyOutputAlarm.Arn}"
                ]
              }
            }
          ]
        }

Outputs:
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=fossilrag-${FunctionName}
    Description: Console URL for the pipeline health dashboard.

  CompositeAlarmName:
    Value: !Ref PipelineHealthCompositeAlarm
    Description: Single alarm to wire into PagerDuty / Slack.
