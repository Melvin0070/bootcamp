name: fossilrag-ci

# Path-filtered so other repo changes don't burn CI minutes.
on:
  pull_request:
    branches: [main]
    paths:
      - 'fossilrag/**'
      - '.github/workflows/fossilrag-ci.yml'
  push:
    branches: [main]
    paths:
      - 'fossilrag/**'
      - '.github/workflows/fossilrag-ci.yml'
  workflow_dispatch:

concurrency:
  group: fossilrag-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: fossilrag

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install ruff
        run: python -m pip install --upgrade pip "ruff>=0.15"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    # Real Postgres WITH pgvector so the integration tests (HNSW search,
    # idempotent upsert, the /excavate e2e via TestClient) actually run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (unit + integration) with coverage gate
        run: pytest -v --cov=fossilrag --cov-report=term-missing --cov-fail-under=85

  compose-e2e:
    name: docker compose e2e (spine over HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build + start the stack
        run: docker compose up -d --build
      - name: smoke (ingest -> excavate over real HTTP)
        run: |
          python -m pip install --upgrade pip "httpx>=0.28"
          python -m scripts.smoke http://localhost:8000
      - name: dump logs on failure
        if: failure()
        run: docker compose logs
      - name: teardown
        if: always()
        run: docker compose down -v

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fossilrag/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend, no creds)
        run: terraform init -backend=false
      - name: validate
        run: terraform validate

  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [lint, test, compose-e2e, terraform]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: gate
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] \
             || [[ "${{ needs.test.result }}" != "success" ]] \
             || [[ "${{ needs.compose-e2e.result }}" != "success" ]] \
             || [[ "${{ needs.terraform.result }}" != "success" ]]; then
            echo "::error::a required job failed (lint=${{ needs.lint.result }}, test=${{ needs.test.result }}, compose-e2e=${{ needs.compose-e2e.result }}, terraform=${{ needs.terraform.result }})"
            exit 1
          fi
          echo "ci_ok"
