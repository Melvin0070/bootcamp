name: activity-12-ci

# Path-filtered so unrelated activity changes don't burn matrix minutes.
on:
  pull_request:
    branches: [main]
    paths:
      - 'activities/week2/activity-12-fastapi-search/**'
      - '.github/workflows/activity-12-ci.yml'
  push:
    branches: [main]
    paths:
      - 'activities/week2/activity-12-fastapi-search/**'
      - '.github/workflows/activity-12-ci.yml'
  workflow_dispatch:

concurrency:
  group: activity-12-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: activities/week2/activity-12-fastapi-search

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: activities/week2/activity-12-fastapi-search/requirements-dev.txt
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    # Real Postgres so the integration tests (index EXPLAIN, concurrency,
    # injection safety) actually run instead of skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: activities/week2/activity-12-fastapi-search/requirements-dev.txt
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: pytest (unit + integration against the postgres service)
        # Coverage scoped to the runtime modules (app, db). The seed
        # script, locustfile, and broken baseline are operational/
        # demonstration code, not part of the served surface.
        run: pytest -v --cov=app --cov=db --cov-report=term-missing --cov-fail-under=85

  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: gate
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::upstream job failed (lint=${{ needs.lint.result }}, test=${{ needs.test.result }})"
            exit 1
          fi
          echo "ci_ok"
