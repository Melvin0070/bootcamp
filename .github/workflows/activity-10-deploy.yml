name: activity-10-deploy-staging

# Fires only on a successful merge to main that touches the activity.
# Manual dispatch is also allowed so a maintainer can redeploy the
# current main without a code change (e.g. to recover from a deleted
# bucket object).
on:
  push:
    branches: [main]
    paths:
      - 'activities/week2/activity-10-cicd/**'
      - '.github/workflows/activity-10-deploy.yml'
  workflow_dispatch:

# Serialise deploys per environment. Two merges within seconds enqueue
# rather than racing — the second waits for the first to finish so we
# never have two `latest` pointer updates fighting in S3.
concurrency:
  group: activity-10-deploy-staging
  cancel-in-progress: false

# id-token: write is the load-bearing line — it is what lets
# aws-actions/configure-aws-credentials exchange the GitHub OIDC JWT
# for short-lived AWS credentials. contents: read is for checkout.
permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: activities/week2/activity-10-cicd

jobs:
  build:
    name: build artifact
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: activities/week2/activity-10-cicd/requirements.txt
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: smoke import
        # The slowest possible smoke test: import the module. If a
        # dependency is missing or a syntax error slipped through CI,
        # we want to fail before assuming a role and touching S3.
        run: python -c "import pipeline; assert callable(pipeline.run)"
      - name: package
        run: |
          mkdir -p dist
          zip -j "dist/pipeline-${GITHUB_SHA}.zip" pipeline.py requirements.txt
      - name: meta
        id: meta
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifact
          path: activities/week2/activity-10-cicd/dist/
          retention-days: 14

  deploy-staging:
    name: deploy → staging
    runs-on: ubuntu-latest
    needs: [build]
    # Bind to the `staging` environment so its protection rules apply:
    # required reviewer (one human approval), 30-second wait timer,
    # and the AWS_ROLE_TO_ASSUME / STAGING_BUCKET secrets that are only
    # readable from this environment. See docs/branch-protection.md.
    environment:
      name: staging
      url: https://staging.fossilrag.example.com/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-artifact
          path: activities/week2/activity-10-cicd/dist/
      - name: configure aws credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gha-activity10-${{ needs.build.outputs.sha }}
          aws-region: us-east-1
          # No `aws-access-key-id` / `aws-secret-access-key` inputs —
          # if either ever appears here, fail loudly: that means a
          # human pasted long-lived credentials into this workflow.
      - name: deploy
        run: |
          chmod +x scripts/deploy_staging.sh
          ./scripts/deploy_staging.sh \
            "dist/pipeline-${{ needs.build.outputs.sha }}.zip" \
            "${{ secrets.STAGING_BUCKET }}" \
            "${{ needs.build.outputs.sha }}"
      - name: smoke test
        # Smoke runs against the just-deployed object; failure here
        # leaves the staging environment marked failed in the GitHub
        # UI, which is the cue for an operator to roll back.
        run: |
          chmod +x scripts/smoke_staging.sh
          ./scripts/smoke_staging.sh \
            "${{ secrets.STAGING_BUCKET }}" \
            "${{ needs.build.outputs.sha }}"
