name: activity-11-ci

# Path-filtered so unrelated activity changes don't burn matrix minutes.
on:
  pull_request:
    branches: [main]
    paths:
      - 'activities/week2/activity-11-observability/**'
      - '.github/workflows/activity-11-ci.yml'
  push:
    branches: [main]
    paths:
      - 'activities/week2/activity-11-observability/**'
      - '.github/workflows/activity-11-ci.yml'
  workflow_dispatch:

concurrency:
  group: activity-11-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: activities/week2/activity-11-observability

jobs:
  lint:
    name: lint (ruff + cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: activities/week2/activity-11-observability/requirements-dev.txt
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: cfn-lint observability template
        run: cfn-lint infra/observability.yaml

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: activities/week2/activity-11-observability/requirements-dev.txt
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -v --cov=. --cov-report=term-missing --cov-fail-under=85

  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: gate
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::upstream job failed (lint=${{ needs.lint.result }}, test=${{ needs.test.result }})"
            exit 1
          fi
          echo "ci_ok"
