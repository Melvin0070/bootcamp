# Local orchestration for FossilRAG (Component 6).
#
# Two layers, by design:
#
#   • DEFAULT  (`docker compose up`)  — the retrieval spine: Postgres+pgvector
#     and the API. No token, no LocalStack. This is exactly the path CI's
#     compose-e2e job builds and smoke-tests, so it must stay self-contained.
#
#   • `aws` PROFILE  (`docker compose --profile aws up`) — the full emulated
#     serverless stack: LocalStack (S3+SQS+DynamoDB) + a one-shot `bootstrap`
#     that provisions the same topology Terraform deploys (infra/) + a `worker`
#     that drains the ingest queue into silver. Demonstrates the decoupled
#     ingestion loop end-to-end at $0.
#
# Why a profile, not the default: since LocalStack 2026.03 even the free tier
# needs an account token (LOCALSTACK_AUTH_TOKEN), so it can't run unattended in
# CI — the worker/poller/bootstrap logic is covered by moto instead (see
# tests/). The `aws` profile is the manual, locally-runnable demo.

x-aws-env: &aws-env
  # boto3 honours AWS_ENDPOINT_URL globally → S3 + SQS + DynamoDB all hit LocalStack.
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  FOSSILRAG_RAW_BUCKET: fossilrag-raw
  FOSSILRAG_SILVER_BUCKET: fossilrag-silver
  FOSSILRAG_GOLD_BUCKET: fossilrag-gold
  FOSSILRAG_INGEST_QUEUE: fossilrag-ingest
  FOSSILRAG_INGEST_DLQ: fossilrag-ingest-dlq
  FOSSILRAG_IDEMPOTENCY_BACKEND: dynamodb
  FOSSILRAG_IDEMPOTENCY_TABLE: fossilrag-idempotency
  FOSSILRAG_PROMPT_CACHE_TABLE: fossilrag-prompt-cache
  FOSSILRAG_LOG_LEVEL: INFO

# AI providers. Mock by default ($0, offline). Set these (e.g. in a .env file)
# to flip the whole stack to REAL AI — e.g. free Gemini via its OpenAI-compat
# endpoint: FOSSILRAG_LLM_PROVIDER=openai, FOSSILRAG_EMBED_PROVIDER=openai,
# FOSSILRAG_OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/,
# FOSSILRAG_OPENAI_API_KEY=..., FOSSILRAG_OPENAI_MODEL=gemini-2.0-flash,
# FOSSILRAG_EMBED_MODEL=text-embedding-004, FOSSILRAG_EMBED_DIM=768.
x-ai-env: &ai-env
  FOSSILRAG_EMBED_PROVIDER: ${FOSSILRAG_EMBED_PROVIDER:-mock}
  FOSSILRAG_EMBED_MODEL: ${FOSSILRAG_EMBED_MODEL:-mock-deterministic-v1}
  FOSSILRAG_EMBED_DIM: ${FOSSILRAG_EMBED_DIM:-384}
  FOSSILRAG_LLM_PROVIDER: ${FOSSILRAG_LLM_PROVIDER:-mock}
  FOSSILRAG_OPENAI_API_KEY: ${FOSSILRAG_OPENAI_API_KEY:-}
  FOSSILRAG_OPENAI_BASE_URL: ${FOSSILRAG_OPENAI_BASE_URL:-}
  FOSSILRAG_OPENAI_MODEL: ${FOSSILRAG_OPENAI_MODEL:-gpt-4o-mini}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fossilrag
      POSTGRES_PASSWORD: fossilrag
      POSTGRES_DB: fossilrag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fossilrag -d fossilrag"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *ai-env
      DATABASE_URL: postgresql://fossilrag:fossilrag@postgres:5432/fossilrag
      FOSSILRAG_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- `aws` profile: emulated serverless ingestion loop -------------------
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:latest}
    profiles: ["aws"]
    environment:
      SERVICES: s3,sqs,dynamodb
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      # Required since LocalStack 2026.03 (free for students/OSS). Left blank so
      # `docker compose config` validates without it; set it before `up`.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  bootstrap:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    profiles: ["aws"]
    command: ["python", "-m", "scripts.localstack_init"]
    environment: *aws-env
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    profiles: ["aws"]
    command: ["python", "-m", "scripts.worker"]
    # AWS + AI env, plus the DB + index flag: with FOSSILRAG_WORKER_INDEX=true the
    # worker runs the full pipeline (extract→embed→upsert) so an S3 upload becomes
    # searchable end-to-end. Uses the SAME embedder as the api (so vectors match).
    environment:
      <<: [*aws-env, *ai-env]
      DATABASE_URL: postgresql://fossilrag:fossilrag@postgres:5432/fossilrag
      FOSSILRAG_WORKER_INDEX: ${FOSSILRAG_WORKER_INDEX:-false}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- `ui` profile: React Fossil UI (mutation #7) -------------------------
  # nginx serves the built SPA and reverse-proxies /api -> the api service, so
  # the browser is same-origin (no CORS). Profiled so the default `up` (and CI's
  # compose-e2e) stay the lean spine; the UI is verified by its own `ui` CI job.
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    profiles: ["ui"]
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
