server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy the API: /api/excavate -> http://api:8000/excavate (the
  # trailing slash on proxy_pass strips the /api prefix). Keeps the browser
  # same-origin with the API, matching the Vite dev proxy — so no CORS.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets are immutable (expires sets Cache-Control: max-age).
  location /assets/ {
    expires 1y;
  }

  # SPA shell + routes. Security headers live here (not on /api/, where the API
  # middleware sets its own, nor on /assets). The CSP allowlists Google Fonts:
  # the stylesheet from fonts.googleapis.com and the woff2 from fonts.gstatic.com;
  # 'unsafe-inline' covers font-loading inline styles; data: covers the CSS grain
  # texture + svg favicon. NOTE: config-validated, not visually verified here.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }
}
